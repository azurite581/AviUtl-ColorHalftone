name: Release

run-name: Release ${{github.ref_name}} by @${{github.actor}}
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERSION: ${{github.ref_name}}

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for latest tag
      id: tag
      run: |
        latest_tag=$(git describe --tags --abbrev=0)
        echo "version=${latest_tag}" >> "${GITHUB_OUTPUT}"

    - name: Create zip archive
      run: zip -r "ColorHalftone_${VERSION}.zip" ColorHalftone.anm ColorHalftone.frag README.md LICENSE.txt Licenses
      env:
        VERSION: ${{steps.tag.outputs.version}}

    - name: Create release notes
      run: gh release create "${VERSION}" --generate-notes ${{github.workspace}}/*.zip
      env:
        VERSION: ${{steps.tag.outputs.version}}
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}